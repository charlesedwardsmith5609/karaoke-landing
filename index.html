<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke Karl</title>
<meta name="description" content="Request a song, tip the host, and join the fun with Karaoke Karl.">
<meta name="theme-color" content="#0a1530">
<link rel="icon" href="karl.png">
<style>
  @font-face { font-family: "Fjalla One"; src: url("fonts/fjalla-one.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Lora"; src: url("fonts/lora-italic.woff2") format("woff2"); font-weight: 400 700; font-style: italic; font-display: swap; }
  :root {
    --navy: #0a1530;
    --navy-2: #12265a;
    --gold: #f0b93a;
    --gold-2: #ffdc78;
    --ice: #96cdeb;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Lora", Georgia, serif;
    color: var(--white);
    background:
      radial-gradient(ellipse at 50% 0%, #2a6fb8 0%, rgba(42,111,184,0) 55%),
      linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 60%, #050b1c 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 460px;
    margin: 0 auto;
    padding: 36px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .avatar {
    width: 168px; height: 168px;
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(240,185,58,.9), 0 12px 40px rgba(0,0,0,.5), 0 0 60px rgba(240,185,58,.25);
    display: block;
  }
  h1 {
    font-family: "Fjalla One", "Arial Narrow", Impact, sans-serif;
    font-weight: 400;
    font-size: 44px;
    letter-spacing: .08em;
    margin: 22px 0 6px;
    text-align: center;
    text-shadow: 0 3px 12px rgba(0,0,0,.5);
  }
  .tag {
    font-style: italic;
    font-weight: 600;
    color: var(--ice);
    font-size: 18px;
    margin: 0 0 28px;
    text-align: center;
  }
  .links { width: 100%; display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .btn {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 20px;
    min-height: 84px;
    border-radius: 18px;
    text-decoration: none;
    color: var(--white);
    background: rgba(5, 12, 36, .72);
    border: 2px solid rgba(240,185,58,.75);
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .btn:hover, .btn:focus-visible { transform: translateY(-2px); background: rgba(18, 38, 90, .9); border-color: var(--gold-2); outline: none; }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { box-shadow: 0 0 0 4px rgba(255,220,120,.55); }
  .btn.primary { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #1a1405; border-color: var(--gold-2); }
  .btn.primary:hover, .btn.primary:focus-visible { background: linear-gradient(180deg, #ffe58f, #f7c24a); }
  .ic {
    flex: 0 0 52px; width: 52px; height: 52px; border-radius: 14px;
    display: grid; place-items: center;
    background: rgba(240,185,58,.16);
    color: var(--gold-2);
  }
  .primary .ic { background: rgba(26,20,5,.12); color: #1a1405; }
  .ic svg { width: 30px; height: 30px; }
  .txt { flex: 1; min-width: 0; }
  .title { font-family: "Fjalla One", "Arial Narrow", Impact, sans-serif; font-size: 26px; letter-spacing: .05em; line-height: 1.1; display: block; }
  .sub { font-size: 15px; opacity: .85; display: block; margin-top: 4px; font-style: italic; }
  .chev { flex: 0 0 auto; width: 22px; height: 22px; opacity: .8; }
  footer { margin-top: 30px; font-family: "Fjalla One", "Arial Narrow", sans-serif; letter-spacing: .12em; font-size: 16px; opacity: .7; text-align: center; }
</style>
</head>
<body>
<main>
  <img class="avatar" src="karl.png" alt="Karaoke Karl" width="168" height="168">
  <h1>KARAOKE KARL</h1>
  <p class="tag">Pick a song. Tip your host. Join the fun.</p>

  <ul class="links">
    <!-- To remove a button, delete its whole <li> block. To change where one goes, edit its href. -->

    <li>
      <a class="btn primary" href="https://costume-voting.vercel.app/" target="_blank" rel="noopener">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>
        </span>
        <span class="txt"><span class="title">COSTUME CONTEST</span><span class="sub">Nominate and vote</span></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </li>

    <li>
      <a class="btn" href="https://www.karafun.com/069387" target="_blank" rel="noopener">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
        </span>
        <span class="txt"><span class="title">REQUEST A SONG</span><span class="sub">Open Karafun on your phone</span></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </li>

    <li>
      <a class="btn" href="https://venmo.com/u/Charles-Smith-542" target="_blank" rel="noopener">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2C14.4 8.4 13.4 8 12 8c-1.6 0-2.7.7-2.7 1.8 0 2.6 5.4 1.2 5.4 3.9 0 1.1-1.1 1.9-2.7 1.9-1.4 0-2.5-.5-3-1.4"/><path d="M12 6.5V8M12 16v1.5"/></svg>
        </span>
        <span class="txt"><span class="title">TIP THE HOST</span><span class="sub">Venmo @Charles-Smith-542</span></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </li>



  </ul>

  <footer>@KARAOKARL</footer>
</main>
</body>
</html>
