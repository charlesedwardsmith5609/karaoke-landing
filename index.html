<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karaoke Karl</title>
<meta name="description" content="Karaoke Karl: every Wednesday, 7 to 11 PM at Aegir's Public House. Request a song, tip the host, and join the costume contest.">
<meta name="theme-color" content="#0e061e">
<link rel="icon" href="karl.png">
<style>
  @font-face { font-family: "Fjalla One"; src: url("fonts/fjalla-one.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Lora"; src: url("fonts/lora-italic.woff2") format("woff2"); font-weight: 400 700; font-style: italic; font-display: swap; }
  :root {
    --orange: #ff7614;
    --orange-2: #ff9a3c;
    --gold: #ffd27a;
    --bone: #f3e8d4;
    --ink: #1a1020;
    --night: #0e061e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); }
  body { font-family: "Lora", Georgia, serif; color: var(--bone); -webkit-font-smoothing: antialiased; }

  .scene {
    position: relative; overflow: hidden;
    min-height: 100vh; min-height: 100svh;
    background: linear-gradient(180deg, #0e061e 0%, #1d0b35 45%, #3e1648 75%, #8c3424 100%);
  }

  /* ---------- scenery ---------- */
  .moon {
    position: absolute; z-index: 0; top: 2.5svh; right: 5vw;
    width: clamp(64px, 19vw, 104px); aspect-ratio: 1; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 28%, rgba(235,196,142,.9) 0 7%, transparent 8%),
      radial-gradient(circle at 62% 40%, rgba(235,196,142,.8) 0 9%, transparent 10%),
      radial-gradient(circle at 45% 70%, rgba(235,196,142,.85) 0 8%, transparent 9%),
      radial-gradient(circle at 72% 72%, rgba(235,196,142,.75) 0 5%, transparent 6%),
      radial-gradient(circle at 35% 35%, #fff2cf, #ffdca0 62%, #f2c488);
    box-shadow: 0 0 50px 16px rgba(255,150,60,.35);
    animation: moonglow 5s ease-in-out infinite;
  }
  @keyframes moonglow { 0%,100% { box-shadow: 0 0 44px 12px rgba(255,150,60,.28); } 50% { box-shadow: 0 0 72px 26px rgba(255,150,60,.5); } }
  .web { position: absolute; z-index: 0; top: 0; left: 0; width: clamp(90px, 28vw, 150px); opacity: .55; pointer-events: none; }
  .fly { position: absolute; z-index: 1; left: 0; pointer-events: none; will-change: transform; animation: cross linear infinite; }
  .fly svg { display: block; width: var(--w, 52px); height: auto; animation: flap .34s ease-in-out infinite alternate; transform-origin: 50% 60%; }
  .fly.b1 { top: 5svh; --w: 54px; animation-duration: 17s; animation-delay: -3s; }
  .fly.b2 { top: 13svh; --w: 38px; animation-duration: 23s; animation-delay: -12s; }
  .fly.b3 { top: 21svh; --w: 46px; animation-duration: 29s; animation-delay: -20s; }
  @keyframes cross { from { transform: translateX(-90px); } to { transform: translateX(calc(100vw + 90px)); } }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.55); } }

  .fog { position: absolute; z-index: 0; left: -20%; width: 140%; height: 26svh; bottom: 6svh; pointer-events: none;
    background: radial-gradient(ellipse at 30% 60%, rgba(150,90,190,.32), transparent 60%), radial-gradient(ellipse at 75% 50%, rgba(130,80,170,.28), transparent 60%);
    animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-6%); } to { transform: translateX(6%); } }

  .ground { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; height: 84px; pointer-events: none; }
  .ground svg.hill { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ground-inner { position: relative; width: min(100%, 520px); height: 100%; margin: 0 auto; }
  .stone { position: absolute; bottom: 28px; width: 22px; height: 34px; border-radius: 12px 12px 0 0; background: #24123a; }
  .stone::before { content: ""; position: absolute; left: 50%; top: 7px; width: 2px; height: 14px; margin-left: -1px; background: #3d2860; }
  .stone::after { content: ""; position: absolute; left: 50%; top: 11px; width: 10px; height: 2px; margin-left: -5px; background: #3d2860; }
  .pk { position: absolute; bottom: 16px; width: clamp(60px, 16vw, 78px); height: auto; animation: flicker 2.6s ease-in-out infinite; }
  .pk.l { left: 12px; } .pk.r { right: 12px; animation-delay: -1.3s; }
  @keyframes flicker { 0%,100% { filter: drop-shadow(0 0 8px rgba(255,140,30,.55)); } 45% { filter: drop-shadow(0 0 18px rgba(255,170,50,.95)); } 70% { filter: drop-shadow(0 0 10px rgba(255,140,30,.65)); } }
  .handle { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-family: "Fjalla One", "Arial Narrow", sans-serif; letter-spacing: .14em; font-size: 16px; color: var(--bone); opacity: .85; }

  /* ---------- content ---------- */
  main {
    position: relative; z-index: 3;
    max-width: 460px; margin: 0 auto;
    min-height: 100vh; min-height: 100svh;
    padding: clamp(10px, 2.2svh, 22px) 18px 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .avatar {
    width: clamp(92px, 15svh, 158px); height: auto; aspect-ratio: 1; border-radius: 50%; display: block; object-fit: cover;
    box-shadow: 0 0 0 3px rgba(255,122,20,.95), 0 10px 30px rgba(0,0,0,.55), 0 0 40px rgba(255,122,20,.45);
    animation: bob 4s ease-in-out infinite, aura 3s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes aura { 0%,100% { box-shadow: 0 0 0 3px rgba(255,122,20,.95), 0 10px 30px rgba(0,0,0,.55), 0 0 34px rgba(255,122,20,.35); } 50% { box-shadow: 0 0 0 3px rgba(255,170,60,1), 0 10px 30px rgba(0,0,0,.55), 0 0 56px rgba(255,122,20,.7); } }
  h1 {
    font-family: "Fjalla One", "Arial Narrow", Impact, sans-serif; font-weight: 400;
    font-size: clamp(34px, 6.4svh, 46px); letter-spacing: .08em; line-height: 1;
    margin: clamp(8px, 1.6svh, 14px) 0 0; text-align: center; color: #fff;
    text-shadow: 0 0 18px rgba(255,122,20,.65), 0 3px 10px rgba(0,0,0,.6);
  }
  .when { margin: clamp(6px, 1.2svh, 10px) 0 0; text-align: center; line-height: 1.15; }
  .when .d { display: block; font-family: "Fjalla One", "Arial Narrow", sans-serif; font-size: clamp(19px, 3.3svh, 23px); letter-spacing: .12em; color: var(--gold); }
  .when .p { display: block; margin-top: 3px; font-style: italic; font-weight: 600; font-size: clamp(15px, 2.5svh, 18px); color: var(--bone); }

  .links { width: 100%; display: grid; gap: clamp(8px, 1.4svh, 12px); margin: clamp(12px, 2.2svh, 20px) 0 0; padding: 0; list-style: none; }
  .btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 14px;
    padding: 9px 16px; min-height: clamp(60px, 9.4svh, 88px);
    border-radius: 18px; text-decoration: none; color: var(--bone);
    background: rgba(24, 9, 42, .82);
    border: 2px solid rgba(255,122,20,.7);
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
    animation: spot 6s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .links li:nth-child(2) .btn, .links li:nth-child(2) .btn::after { animation-delay: 2s; }
  .links li:nth-child(3) .btn, .links li:nth-child(3) .btn::after { animation-delay: 4s; }
  .btn::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,235,190,.38) 50%, transparent 65%);
    transform: translateX(-130%); animation: sweep 6s ease-in-out infinite;
  }
  @keyframes spot {
    0%   { transform: scale(1); border-color: rgba(255,122,20,.7); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
    5%, 27% { transform: scale(1.035); border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,210,122,.35), 0 0 30px 6px rgba(255,122,20,.65); }
    36%, 100% { transform: scale(1); border-color: rgba(255,122,20,.7); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  }
  @keyframes sweep { 0%, 4% { transform: translateX(-130%); } 24%, 100% { transform: translateX(130%); } }
  .btn:hover, .btn:focus-visible { border-color: var(--gold); outline: none; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: linear-gradient(180deg, #ffa54a, #f26a00); color: var(--ink); border-color: #ffc57a; }
  .ic { flex: 0 0 46px; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: rgba(255,122,20,.18); color: var(--orange-2); }
  .primary .ic { background: rgba(26,16,32,.14); color: var(--ink); }
  .ic svg { width: 27px; height: 27px; }
  .txt { flex: 1; min-width: 0; }
  .title { display: block; font-family: "Fjalla One", "Arial Narrow", Impact, sans-serif; font-size: clamp(22px, 3.6svh, 27px); letter-spacing: .05em; line-height: 1.08; }
  .sub { display: block; font-size: 14.5px; opacity: .9; margin-top: 2px; font-style: italic; }
  .chev { flex: 0 0 auto; width: 20px; height: 20px; opacity: .85; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .fly { display: none; }
  }
</style>
</head>
<body>

<div class="scene">

    <line x1="0" y1="0" x2="300" y2="0"/><line x1="0" y1="0" x2="260" y2="150"/><line x1="0" y1="0" x2="212" y2="212"/><line x1="0" y1="0" x2="150" y2="260"/><line x1="0" y1="0" x2="0" y2="300"/>
